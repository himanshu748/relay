        "mainEntity": [
          {"@type":"Question","name":"Is this only a chat history wrapper?","acceptedAnswer":{"@type":"Answer","text":"No. Relay reads persisted incident state before choosing an action. Failed remediation and operator constraints materially change the next recommendation."}},
          {"@type":"Question","name":"What happens without Sibyl Memory?","acceptedAnswer":{"@type":"Answer","text":"A fresh responder loses the failed restart and the database constraint, then falls back to the same restart that already produced no improvement."}},
          {"@type":"Question","name":"Is the fresh session real?","acceptedAnswer":{"@type":"Answer","text":"Yes. Relay creates a new session identifier, reloads the incident memories and writes a visible receipt to the journal."}},
          {"@type":"Question","name":"Can a responder add new evidence?","acceptedAnswer":{"@type":"Answer","text":"Yes. Observations, actions, constraints and hypotheses can be persisted while the incident is active."}},
          {"@type":"Question","name":"Which memory primitives are used?","acceptedAnswer":{"@type":"Answer","text":"Relay uses a durable incident entity, HOT active state and COLD journal events through the real Sibyl Memory client."}},
          {"@type":"Question","name":"Is the recommendation generated by an external model?","acceptedAnswer":{"@type":"Answer","text":"No. This prototype uses deterministic decision logic so the causal effect of memory stays reproducible without a model key."}}
        ]
      }
